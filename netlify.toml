# React Router emits a generic SPA fallback as well as one real index.html per
# declared route. Do not route to the SPA fallback: unknown URLs must preserve
# their URL and return the prerendered Madison 404 with a real HTTP 404 status.
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404

# ─── Headers ──────────────────────────────────────────────────────────────────

# Vite content-hashes everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font filenames are stable rather than content-hashed, so cache them long
# enough to remove repeat-visit transfer without making future replacements
# effectively permanent in browsers.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Team email-signature banner images: public so mail apps can load them, but
# kept out of search engines (including image search).
[[headers]]
  for = "/sig-bumceoquwx/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Client-story PDF download links: reachable by link, kept out of search engines.
[[headers]]
  for = "/story-downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

