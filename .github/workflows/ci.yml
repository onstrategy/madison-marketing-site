name: CI

# Governance-as-code: the merge gate runs on every push to main and every PR.
# `bun run check` = turbo typecheck + test + lint across packages/ui and apps/sandbox.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (typecheck · test · lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (typecheck + test + lint)
        run: bun run check

  react-doctor:
    name: react-doctor (react health)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # React code-health gate (security/perf/correctness/a11y/architecture).
      # Fails only on error-level findings; warnings surface as PR annotations.
      # Tighten to `--fail-on warning` once the warning backlog is burned down.
      - name: React Doctor
        run: bun run react-doctor -- --annotations

