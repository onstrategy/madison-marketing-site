<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Madison Ai — the AI platform built for local government."
    />
    <!-- Demo deployment: kept out of search results. The client flips this off
         when they deploy from their own account — see docs/publishing.md. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Madison type: Lora (display/headings) + Inter (body). Inter is also self-hosted via @fontsource in main.tsx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The landing page hotlinks Unsplash (prototypes/landing/photos.ts); this
         saves a DNS + TLS round-trip on the LCP image. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Madison Ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
