  <!--
    Favicon — the Madison Ai mark in white on a Neon Blue circular badge,
    the same "hub" badge treatment used elsewhere on-token (bg-brand +
    text-brand-fg — see e.g. ConnectorsSection in
    apps/sandbox/src/prototypes/platform-page/template.tsx). A favicon
    can't read CSS variables, so both hexes are inlined here — if the
    brand-primary or brand-foreground tokens ever change in tokens.tsx,
    update this file too (and apps/sandbox/public/favicon.svg, its copy).

    Mark geometry mirrors MarkPaths() in packages/ui/src/primitives/logo.tsx,
    scaled from its native 166×100 box to 50×30.12 and centered in the
    100×100 canvas.
  -->
